# Composite action: albdf CI toolchain.
#
# Sets up the same toolchain the dev container uses, on GitHub-hosted
# runners (Linux x86_64/arm64 and macOS arm64/x86_64):
#   - vcpkg, pinned to a release tag, with its *binary cache* restored from
#     actions/cache (keyed on the manifest + overlay hashes + vcpkg ref) so
#     the 11 manifest deps are built once, not on every run
#   - cmake + ninja (apt on Linux, Homebrew on macOS; gnu-tar on macOS for
#     deterministic release tarballs)
#   - Qt 6.8 (qtbase + qtsvg) from the official Qt archives via aqtinstall —
#     the apt Qt on ubuntu-24.04 is 6.4, which does not satisfy the
#     project's find_package(Qt6 6.8 REQUIRED)
#
# The vcpkg overlay (src/vcpkg/overlays — blend2d/asmjit pin fixes gcc15 +
# aarch64 CMake recursion bugs, see docs/PROBLEMS.md) is wired via the
# VCPKG_OVERLAY_PORTS environment variable, which the vcpkg CMake toolchain
# reads on every configure — matching the local bare-container flow.

name: Setup albdf toolchain
description: >-
  Installs the albdf CI toolchain on GitHub-hosted runners: pinned vcpkg
  with persisted binary cache, cmake+ninja, and Qt 6.8 (qtbase + qtsvg)
  with CMAKE_PREFIX_PATH exported so plain cmake invocations find it.

inputs:
  install-qt:
    description: Install Qt 6.8 via aqtinstall (false for format-only jobs)
    required: false
    default: 'true'
  qt-arch:
    description: >-
      aqt Qt target for Linux (linux_gcc_64 / linux_gcc_arm64). macOS is
      auto-detected from runner.arch (mac_arm64 / mac_x86_64).
    required: false
    default: linux_gcc_64

runs:
  using: composite
  steps:
    - name: Cache vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-bincache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.ALBDF_VCPKG_REF }}-${{ hashFiles('src/vcpkg.json', 'src/vcpkg/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ env.ALBDF_VCPKG_REF }}-

    - name: Checkout vcpkg (pinned ref)
      shell: bash
      run: |
        git clone --depth 1 --branch "${ALBDF_VCPKG_REF}" https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
        # The vcpkg executable is NOT in the repo — it is produced by the
        # bootstrap script. Without this, every job fails with exit 127
        # (vcpkg/vcpkg: No such file or directory).
        "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
        "${VCPKG_ROOT}/vcpkg" version

    - name: Install build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # gnu-tar: scripts/package.sh uses GNU tar flags for deterministic
        # release tarballs; the system bsdtar lacks --sort/--numeric-owner.
        # fontconfig: pdffont.cpp needs it on all Unix (Q_OS_UNIX); Qt for
        # macOS uses CoreText and does NOT drag fontconfig in transitively,
        # so pkg_check_modules(FONTCONFIG REQUIRED) must find it here.
        # pkg-config: required by pkg_check_modules (fribidi, fontconfig).
        # qt: brew Qt is used on macOS (NOT aqt) so the release binary links
        # against the standard /opt/homebrew|/usr/local framework paths that
        # users have after `brew install qt` — an aqt Qt in the CI temp dir
        # would make the shipped binary un-runnable off the runner.
        # HOMEBREW_NO_REQUIRE_TAP_TRUST: GitHub's macOS runner image carries an
        # untrusted `aws/tap` (brew tap-trust feature, 2026); without this
        # every `brew install` fails with "The following taps are not trusted".
        HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_REQUIRE_TAP_TRUST=1 \
          brew install cmake ninja gnu-tar fontconfig pkg-config qt
        # brew's pkgconfig dir is $(brew --prefix)/lib/pkgconfig — on Apple
        # Silicon that is /opt/homebrew, which is NOT in pkg-config's default
        # search path, so export it explicitly for the CMake configure step.
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "${GITHUB_ENV}"
        # Point CMake at brew Qt for find_package(Qt6 6.8 REQUIRED).
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "${GITHUB_ENV}"

    - name: Build ICU 73 (Linux Qt 6.8.3 prebuilt needs it; ubuntu-24.04 ships ICU 74)
      if: runner.os == 'Linux' && inputs.install-qt == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The Qt 6.8.3 online binaries are built against ICU 73, but
        # ubuntu-24.04 ships ICU 74 (ABI-incompatible: libQt6Core needs
        # ucnv_reset_73). No distro packages ICU 73, so build it from the ICU
        # upstream release (~1 min). MUST run BEFORE the Qt install: aqt's
        # post-install check executes qmake, which needs ICU 73 on
        # LD_LIBRARY_PATH (verified: without it qmake fails with
        # "libicui18n.so.73: cannot open shared object file").
        # (macOS: not needed — brew Qt links the system ICU.)
        curl -sL "https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz" -o /tmp/icu73.tgz
        tar xzf /tmp/icu73.tgz -C /tmp
        cd /tmp/icu/source
        ./configure --prefix=/tmp/icu-build --disable-tests --disable-samples --disable-dyload >/dev/null
        make -j"$(nproc)" >/dev/null
        make install >/dev/null
        echo "ICU_BUILD=/tmp/icu-build" >> "${GITHUB_ENV}"
        echo "LD_LIBRARY_PATH=/tmp/icu-build/lib:\${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

    - name: Install Qt 6.8.3 (Linux, qtbase + qtsvg, headless) with retry
      if: runner.os == 'Linux' && inputs.install-qt == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # GITHUB_ENV from the ICU step is applied to this step's environment,
        # so LD_LIBRARY_PATH already includes /tmp/icu-build/lib here — aqt's
        # post-install qmake verification needs it.
        python3 -m pip install --quiet "aqtinstall==3.3.*"
        # aqt resolves the base Qt package through an Updates.xml fetch that is
        # flaky on GH runners ("The packages ['qt_base'] were not found while
        # parsing XML of package information!", miurahr/aqtinstall#769 /
        # jurplel/install-qt-action#231) — it depends on which Qt mirror/CDN
        # edge the runner reaches. Retry across mirrors; aqt rotates mirrors
        # between attempts. Same command verified working locally.
        QT_DIR="${RUNNER_TEMP}/qt"
        QT_ARCH="${{ inputs.qt-arch }}"
        for attempt in 1 2 3; do
          echo "== aqt install attempt ${attempt}/3 (linux ${QT_ARCH}) =="
          if python3 -m aqt install-qt linux desktop 6.8.3 "${QT_ARCH}" \
              --archives qtbase qtsvg \
              --outputdir "${QT_DIR}" \
              --timeout 30; then
            break
          fi
          [ "${attempt}" -lt 3 ] && sleep 10
        done
        # Locate qmake the same way install-qt-action does and export the
        # contract variables the build steps rely on.
        QMAKE="$(find "${QT_DIR}" -path '*/bin/qmake' -type f | head -1)"
        [ -n "${QMAKE}" ] || { echo "qmake not found after Qt install"; exit 1; }
        QT_ROOT_DIR="$(dirname "$(dirname "${QMAKE}")")"
        echo "QT_ROOT_DIR=${QT_ROOT_DIR}"
        echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "${GITHUB_ENV}"
        # Ensure the Qt lib dir is also on LD_LIBRARY_PATH for the build steps.
        echo "LD_LIBRARY_PATH=${QT_ROOT_DIR}/lib:/tmp/icu-build/lib:\${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"
