# albdf — release workflow.
#
# Action pins are EXACT tags on Node 24-native lines, chosen for
# durability (oldest line still receiving releases) and verified
# input-by-input — see docs/PROBLEMS.md, "GitHub Actions runner traps".
# Update them deliberately, not by floating a major tag.
# Builds release binaries for Linux (x86_64 + aarch64) and macOS (arm64 +
# x86_64) from a version tag, then creates the GitHub Release with the
# packaged artifacts attached.
#
# Trigger:
#   - push of a tag matching `0.*` (e.g. `0.4.0`) → full build + Release
#   - workflow_dispatch → build + upload artifacts only (no Release), useful
#     for testing the matrix before tagging
#
# Layout:
#   build     — matrix over 4 platforms; headless Release build + package.sh
#               (deterministic tarball + sha256). Windows is temporarily out of
#               the matrix: the MSVC runner has no pkg-config and
#               src/CMakeLists.txt:52 requires it (see docs/PROBLEMS.md, R6.4).
#   release   — needs build; downloads all artifacts and creates the GitHub
#               Release with `gh` (GITHUB_TOKEN, contents: write). Runs on every
#               tag push, and publishes whichever platforms built even if others
#               failed — see the job comment for why that matters.
#
# (The AppImage/GUI packaging job was removed: this repo ships CLI binaries.)
#
# Toolchain setup is shared with the CI gate via .github/actions/setup-toolchain
# (vcpkg + Qt 6.8 + cmake/ninja, Linux and macOS aware).

name: release

on:
  push:
    tags: ['0.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same pin as ci.yml — keeps the vcpkg binary cache warm across workflows.
  ALBDF_VCPKG_REF: 2026.07.29
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/src/vcpkg/overlays
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # macOS / linux-aarch64 runners have hit first-boot and vcpkg cold-cache
    # stalls (0.4.0's mac + aarch64 legs failed on this). Give them more
    # headroom than the warm-cache linux-x86_64 path.
    timeout-minutes: ${{ matrix.timeout-minutes || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            qt-arch: linux_gcc_arm64
            timeout-minutes: 120
          - platform: macos-arm64
            os: macos-15
            qt-arch: mac_arm64
            timeout-minutes: 120
          - platform: macos-x86_64
            os: macos-15-intel
            qt-arch: mac_x64
            timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH falls back to last commit time

      - uses: ./.github/actions/setup-toolchain
        with:
          qt-arch: ${{ matrix.qt-arch || 'linux_gcc_64' }}

      - name: Configure + build (Release, headless)
        shell: bash
        run: |
          cmake -S src -B src/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DALBDF_BUILD_TESTS=OFF
          cmake --build src/build

      - name: Package release tarball
        shell: bash
        run: |
          # Tag push → tag name (0.4.0). workflow_dispatch (no tag) → fall
          # back to the version in src/CMakeLists.txt.
          if [[ "$GITHUB_REF_NAME" =~ ^[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^set(ALBDF_VERSION \(.*\))$/\1/p' src/CMakeLists.txt | head -1)"
          fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bash scripts/package.sh --build-dir src/build --out-dir dist \
            --version "${VERSION}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build]
    # Publish on EVERY tag push — including when some platform legs failed.
    #
    # This job used to require `needs.build.result == 'success'`, i.e. every
    # leg of the 5-platform matrix. That is the *aggregate* result, so one
    # failing platform skipped the job entirely and discarded the artifacts the
    # other platforms had just finished building — which is exactly how 0.4.0
    # shipped ZERO assets while its linux-x86_64 leg had built successfully.
    # A partial release is strictly better than no release, and the platforms
    # that are absent are named in the release body instead of being silently
    # lost.
    #
    # `always()` is required: without it a failed dependency skips the job no
    # matter what `if` says.
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Require at least one platform artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "== dist contents =="
          ls -la dist/ || true
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no platform artifacts were uploaded — nothing to publish" >&2
            exit 1
          fi
          echo "found ${#files[@]} artifact file(s)"

      - name: Extract release notes from docs/RELEASES.md
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open('docs/RELEASES.md', encoding='utf-8').read()
          # Grab the "## albdf <version>" section up to the next "## " heading.
          m = re.search(
              rf'^## albdf {re.escape(version)}.*?(?=^## albdf |\Z)',
              text, re.M | re.S)
          body = m.group(0).strip() if m else f'albdf {version}'
          with open('/tmp/release-notes.md', 'w', encoding='utf-8') as f:
              f.write(body + '\n')
          PY
          echo "notes bytes: $(wc -c < /tmp/release-notes.md)"

      # MUST stay after the notes step above: that step writes
      # /tmp/release-notes.md in 'w' mode and would clobber this table.
      - name: Append platform availability to the release notes
        shell: bash
        run: |
          set -euo pipefail
          # package.sh names artifacts albdf-<version>-<os>-<arch>.tar.gz, with
          # the arch token x86_64 or aarch64 — so Apple Silicon is
          # "macos-aarch64".
          {
            echo
            echo "### Platform availability"
            echo
            echo "| Platform | Artifact |"
            echo "| --- | --- |"
            for entry in \
              "linux-x86_64:*-linux-x86_64.tar.gz" \
              "linux-aarch64:*-linux-aarch64.tar.gz" \
              "macos-arm64:*-macos-aarch64.tar.gz" \
              "macos-x86_64:*-macos-x86_64.tar.gz"
            do
              platform="${entry%%:*}"
              pattern="${entry#*:}"
              shopt -s nullglob
              hits=(dist/${pattern})
              shopt -u nullglob
              if [ "${#hits[@]}" -gt 0 ]; then
                echo "| ${platform} | \`$(basename "${hits[0]}")\` |"
              else
                echo "| ${platform} | **not built in this release** |"
              fi
            done
          } >> /tmp/release-notes.md
          echo "== notes tail =="
          tail -12 /tmp/release-notes.md

      - name: Publish assets to the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "== dist contents =="
          ls -la dist/
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release already exists: either an earlier tag run published a
            # partial set, or a leg has since been fixed and this run adds it.
            # Upload with --clobber so re-runs are idempotent instead of dying
            # on "release already exists", and refresh the notes.
            echo "release ${TAG} already exists — uploading assets"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "albdf ${VERSION}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "albdf ${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
