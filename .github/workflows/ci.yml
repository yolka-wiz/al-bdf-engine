# albdf — hosted CI gate.
#
# Mirrors the local gate (ci/run-ci.sh — the single source of truth) on
# GitHub-hosted Ubuntu 24.04 runners:
#   gate       — stage 1+2: Release build + offscreen ctest
#   asan       — stage 3:   ASAN/UBSAN Debug build + ctest
#   format     — stage 4:   clang-format gate on authored files
#   gui        — non-gating: GUI stage (ALBDF_BUILD_GUI=ON build of the
#                vendored viewer/editor/page-master + headless smoke;
#                continue-on-error: true — a GUI regression flags itself
#                in the job log instead of blocking the PR)
#   benchmark  — non-gating: scripts/benchmark.sh (1000-page perf smoke,
#                continue-on-error: true — a regression flags itself in the
#                uploaded summary instead of blocking the PR)
#   fuzz       — non-gating: scripts/fuzz.sh (deterministic seeded CLI fuzz
#                harness — crashes/hangs flag themselves in the uploaded
#                summary + reproducer files instead of blocking the PR)
# Each job shells out to ci/run-ci.sh with stage-selection flags so the
# stage logic (compiler flags, sanitizer env, authored-file list) lives in
# exactly one place.
#
# Dependency strategy:
#   - vcpkg is pinned to a release tag (ALBDF_VCPKG_REF) and its binary
#     cache is persisted via actions/cache, keyed on the manifest +
#     overlay hashes. First run on a fresh cache builds the 11 manifest
#     deps (~30-60 min); every run after that restores them in seconds.
#   - Qt 6.8 (qtbase + qtsvg) comes from the official Qt archives
#     (install-qt-action) because the project requires Qt >= 6.8 and the
#     ubuntu-24.04 apt Qt is 6.4. CMAKE_PREFIX_PATH is exported so the
#     plain `cmake` invocations inside ci/run-ci.sh find it.
#   - clang-format is pinned to the dev-container version (21.1.8) via pip.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The local dev container runs this exact tag (vcpkg version 2026-07-27);
  # 2026.07.29 is the closest upstream release tag. Pinning keeps port
  # versions (and therefore vcpkg ABI hashes) stable across CI runs so the
  # binary cache hits.
  ALBDF_VCPKG_REF: 2026.07.29
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # vcpkg binary cache: files source under the workspace, persisted by the
  # actions/cache step in .github/actions/setup-toolchain.
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
  # blend2d/asmjit overlay (in-repo pin — see docs/PROBLEMS.md). The vcpkg
  # CMake toolchain reads this env var on every configure.
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/src/vcpkg/overlays
  QT_QPA_PLATFORM: offscreen

jobs:
  gate:
    name: Build + ctest (Release, offscreen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ci/run-ci.sh's format gate diffs against fork base 6bf5047
      - uses: ./.github/actions/setup-toolchain
      - name: ci/run-ci.sh stages 1-2 (configure + build, offscreen ctest)
        run: bash ci/run-ci.sh --skip-asan --skip-format

  asan:
    name: ASAN/UBSAN build + ctest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: ci/run-ci.sh stage 3 (ASAN/UBSAN Debug build + ctest)
        run: bash ci/run-ci.sh --skip-release --skip-format

  format:
    name: clang-format gate (authored files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format 21.1.8 (matches dev container)
        run: |
          python3 -m pip install --user --break-system-packages clang-format==21.1.8
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: ci/run-ci.sh stage 4 (clang-format gate)
        run: bash ci/run-ci.sh --only-format

  gui:
    name: GUI build + smoke (non-gating)
    runs-on: ubuntu-24.04
    # Informational only: the vendored PDF4QT GUI (ALBDF_BUILD_GUI=ON,
    # M12) is optional — core + CLI + tests stay headless regardless. A
    # GUI build/smoke regression flags itself in the job log and never
    # blocks the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install xvfb (GUI smoke fallback platform)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: ci/run-ci.sh gui stage (GUI build + headless smoke)
        run: bash ci/run-ci.sh --gui

  benchmark:
    name: Perf benchmark 1000p (non-gating)
    runs-on: ubuntu-24.04
    # Informational only: the threshold policy (ALBDF_PERF_THRESHOLD_MS,
    # default 5000) flags regressions in the uploaded summary; a failure here
    # never blocks the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: ci/run-ci.sh stages 1-2 (Release build, offscreen)
        run: bash ci/run-ci.sh --skip-asan --skip-format
      - name: Run perf benchmark (1000-page doc, offscreen)
        run: bash scripts/benchmark.sh --work-dir "$RUNNER_TEMP/albdf-bench"
      - name: Upload benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: ${{ runner.temp }}/albdf-bench/benchmark-summary.txt

  fuzz:
    name: CLI fuzz harness (non-gating)
    runs-on: ubuntu-24.04
    # Informational only: scripts/fuzz.sh exits 1 when the harness finds a
    # crash or hang (reproducers are saved under the work-dir and listed in
    # the summary); a failure here never blocks the PR (continue-on-error).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: ci/run-ci.sh stages 1-2 (Release build, offscreen)
        run: bash ci/run-ci.sh --skip-asan --skip-format
      - name: Run CLI fuzz harness (seeded, offscreen, time-bounded)
        run: bash scripts/fuzz.sh --iterations 200 --max-time 240 --work-dir "$RUNNER_TEMP/albdf-fuzz"
      - name: Upload fuzz summary + cases + reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-summary
          path: |
            ${{ runner.temp }}/albdf-fuzz/fuzz-summary.txt
            ${{ runner.temp }}/albdf-fuzz/fuzz-cases.tsv
            ${{ runner.temp }}/albdf-fuzz/fail
          if-no-files-found: ignore
